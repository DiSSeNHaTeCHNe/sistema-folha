# SonarQube — sistema-folha (backend Java + frontend React/TS)
sonar.projectKey=sistema-folha
sonar.projectName=Sistema Folha
sonar.projectVersion=0.0.1-SNAPSHOT

sonar.sourceEncoding=UTF-8

# SCM em volume externo (ex.: /Volumes/...) pode travar o scanner; desabilitado no analyze.sh
# sonar.scm.disabled=true

# Monorepo: Java + TypeScript
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.source=17
sonar.java.target=17

# Exclusões de ruído / artefatos
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/target/**,\
  **/*.min.js,\
  frontend/src/vite-env.d.ts

sonar.test.exclusions=\
  **/node_modules/**

sonar.coverage.exclusions=\
  **/dto/**,\
  **/api/**/*DTO.java,\
  **/*Application.java,\
  frontend/src/main.tsx,\
  frontend/src/theme.ts

# Cobertura Java (gerada por jacoco-maven-plugin em `mvn test`)
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
# Frontend (opcional, quando houver Vitest coverage):
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
