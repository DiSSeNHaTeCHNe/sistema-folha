services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-prod
    container_name: sistema_folha_api
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sistema_folha
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/api/api-docs >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-prod
      args:
        VITE_API_URL: http://localhost:8083/api
    container_name: sistema_folha_frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: sistema_folha_db
    environment:
      POSTGRES_DB: sistema_folha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: 